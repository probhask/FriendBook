[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API is served at /.netlify/functions/api; expose a tidy alias too.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback (must stay last).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
